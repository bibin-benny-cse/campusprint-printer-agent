name: Build XeroxGo Agent

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Single-File Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore XeroxGo.PrinterAgent/XeroxGo.PrinterAgent.csproj

      - name: Build & Publish Self-Contained win-x64
        run: |
          dotnet publish XeroxGo.PrinterAgent/XeroxGo.PrinterAgent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Upload Standalone .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeroxGo.PrinterAgent-win-x64
          path: XeroxGo.PrinterAgent/bin/Release/net8.0-windows/win-x64/publish/XeroxGo.PrinterAgent.exe

      - name: Install Inno Setup & Build Installer
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" XeroxGo.PrinterAgent/Installer/setup.iss

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeroxGoAgent-Setup-Installer
          path: XeroxGo.PrinterAgent/Installer/Output/XeroxGoAgent-Setup.exe

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XeroxGo.PrinterAgent/Installer/Output/XeroxGoAgent-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
