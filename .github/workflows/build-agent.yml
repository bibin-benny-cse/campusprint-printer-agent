name: Build XeroxGo Agent

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Single-File Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore XeroxGo.PrinterAgent/XeroxGo.PrinterAgent.csproj

      - name: Build & Publish Self-Contained win-x64
        run: |
          dotnet publish XeroxGo.PrinterAgent/XeroxGo.PrinterAgent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Generate Code Signing Certificate & Sign Standalone EXE
        shell: pwsh
        run: |
          # 1. Generate Authenticode Code Signing Certificate for XeroxGo Technologies
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=XeroxGo Technologies, O=XeroxGo Technologies, C=US" -KeyUsage DigitalSignature -FriendlyName "XeroxGo Publisher Certificate" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $password = ConvertTo-SecureString -String "XeroxGo2026!" -Force -AsPlainText
          
          # 2. Export PFX and public CER
          New-Item -ItemType Directory -Force -Path "certs"
          Export-PfxCertificate -Cert $cert -FilePath "certs\XeroxGoCert.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "certs\XeroxGo-Publisher-Certificate.cer"
          
          # 3. Locate Microsoft SignTool (x64) from Windows SDK
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Select-Object -First 1).FullName
          Write-Host "Located SignTool at: $signtool"
          
          # 4. Sign standalone executable with RFC 3161 timestamp
          $exePath = "XeroxGo.PrinterAgent/bin/Release/net8.0-windows/win-x64/publish/XeroxGo.PrinterAgent.exe"
          & $signtool sign /f "certs\XeroxGoCert.pfx" /p "XeroxGo2026!" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exePath
          Write-Host "Successfully signed $exePath"

      - name: Upload Standalone .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeroxGo.PrinterAgent-win-x64
          path: XeroxGo.PrinterAgent/bin/Release/net8.0-windows/win-x64/publish/XeroxGo.PrinterAgent.exe

      - name: Install Inno Setup & Build Installer
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" XeroxGo.PrinterAgent/Installer/setup.iss

      - name: Sign Inno Setup Installer & Stage Certificate
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Select-Object -First 1).FullName
          $setupPath = "XeroxGo.PrinterAgent/Installer/Output/XeroxGoAgent-Setup.exe"
          & $signtool sign /f "certs\XeroxGoCert.pfx" /p "XeroxGo2026!" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setupPath
          Write-Host "Successfully signed $setupPath"
          Copy-Item "certs\XeroxGo-Publisher-Certificate.cer" "XeroxGo.PrinterAgent/Installer/Output/XeroxGo-Publisher-Certificate.cer"

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeroxGoAgent-Setup-Installer
          path: |
            XeroxGo.PrinterAgent/Installer/Output/XeroxGoAgent-Setup.exe
            XeroxGo.PrinterAgent/Installer/Output/XeroxGo-Publisher-Certificate.cer

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            XeroxGo.PrinterAgent/bin/Release/net8.0-windows/win-x64/publish/XeroxGo.PrinterAgent.exe
            XeroxGo.PrinterAgent/Installer/Output/XeroxGoAgent-Setup.exe
            certs/XeroxGo-Publisher-Certificate.cer
            XeroxGo.PrinterAgent/Installer/Trust-Publisher.bat
            install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
